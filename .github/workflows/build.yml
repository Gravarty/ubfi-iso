name: Build ubfi Live ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tools installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools

      - name: Basis-System erstellen
        run: |
          sudo debootstrap \
            --arch=amd64 \
            --components=main,restricted,universe \
            noble rootfs \
            http://archive.ubuntu.com/ubuntu

      - name: sources.list setzen
        run: |
          sudo tee rootfs/etc/apt/sources.list > /dev/null << 'EOF'
          deb http://archive.ubuntu.com/ubuntu noble main restricted universe
          deb http://archive.ubuntu.com/ubuntu noble-updates main restricted universe
          deb http://security.ubuntu.com/ubuntu noble-security main restricted universe
          EOF
          sudo sed -i 's/^          //' rootfs/etc/apt/sources.list

      - name: Pakete installieren
        run: |
          sudo chroot rootfs apt-get update -qq
          sudo chroot rootfs env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            linux-generic \
            live-boot live-boot-initramfs-tools casper initramfs-tools \
            dialog debootstrap parted fdisk dosfstools \
            e2fsprogs xfsprogs btrfs-progs arch-install-scripts \
            network-manager curl wget ca-certificates \
            nano less gawk psmisc pciutils usbutils \
            systemd-sysv udev dbus \
            locales console-setup kbd

      - name: Locale konfigurieren
        run: |
          sudo tee rootfs/etc/locale.gen > /dev/null << 'EOF'
          de_DE.UTF-8 UTF-8
          en_US.UTF-8 UTF-8
          EOF
          sudo sed -i 's/^          //' rootfs/etc/locale.gen
          sudo chroot rootfs locale-gen
          sudo tee rootfs/etc/default/locale > /dev/null << 'EOF'
          LANG=de_DE.UTF-8
          LC_ALL=de_DE.UTF-8
          EOF
          sudo sed -i 's/^          //' rootfs/etc/default/locale

      - name: ubfi.sh einbetten
        run: |
          sudo mkdir -p rootfs/usr/local/bin
          sudo cp ubfi.sh rootfs/usr/local/bin/ubfi.sh
          sudo chmod 755 rootfs/usr/local/bin/ubfi.sh

      - name: Autostart konfigurieren
        run: |
          sudo mkdir -p rootfs/etc/systemd/system/getty@tty1.service.d

          sudo tee rootfs/etc/systemd/system/getty@tty1.service.d/autologin.conf > /dev/null << 'EOF'
          [Service]
          ExecStart=
          ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
          EOF
          sudo sed -i 's/^          //' rootfs/etc/systemd/system/getty@tty1.service.d/autologin.conf

          sudo tee rootfs/root/.profile > /dev/null << 'EOF'
          export LANG=de_DE.UTF-8
          export LC_ALL=de_DE.UTF-8
          export TERM=linux
          unicode_start 2>/dev/null || true
          if [ "$(tty)" = "/dev/tty1" ]; then
              bash /usr/local/bin/ubfi.sh
          fi
          EOF
          sudo sed -i 's/^          //' rootfs/root/.profile

      - name: ISO-Struktur bauen
        run: |
          mkdir -p iso/live iso/boot/grub
          sudo cp rootfs/boot/vmlinuz-* iso/live/vmlinuz
          sudo cp rootfs/boot/initrd.img-* iso/live/initrd
          sudo mksquashfs rootfs iso/live/filesystem.squashfs -comp xz -noappend
          ls -lh iso/live/

      - name: GRUB konfigurieren
        run: |
          sudo tee iso/boot/grub/grub.cfg > /dev/null << 'EOF'
          set default=0
          set timeout=3

          menuentry "ubfi - Ubuntu Fast Install" {
              linux /live/vmlinuz boot=live console=tty1
              initrd /live/initrd
          }
          EOF
          sudo sed -i 's/^          //' iso/boot/grub/grub.cfg

      - name: ISO erstellen
        run: |
          sudo grub-mkrescue -o ubfi-live.iso iso
          ls -lh ubfi-live.iso

      - name: ISO hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ubfi-live-iso
          path: ubfi-live.iso
          retention-days: 7

      - name: Build-Log bei Fehler
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: "*.log"
          retention-days: 3
