name: Build ubfi Live ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Abhaengigkeiten installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            live-build debootstrap xorriso squashfs-tools \
            grub-pc-bin grub-efi-amd64-bin mtools \
            isolinux syslinux-common

      - name: live-build Hack-Script patchen
        run: |
          HACKS=/usr/lib/live/build/lb_chroot_hacks
          if [ -f "$HACKS" ]; then
            sudo sed -i 's/chmod 644 "${LB_CHROOT_PATH}\/boot\/initrd.img"/chmod 644 "${LB_CHROOT_PATH}\/boot\/initrd.img" 2>\/dev\/null || true/g' "$HACKS"
            sudo sed -i 's/chmod 644 "${LB_CHROOT_PATH}\/boot\/initrd.img.old"/chmod 644 "${LB_CHROOT_PATH}\/boot\/initrd.img.old" 2>\/dev\/null || true/g' "$HACKS"
            echo "Patch applied"
          fi
          sudo grep -n "initrd" "$HACKS" || true

      - name: live-build konfigurieren
        run: |
          mkdir lb && cd lb
          lb config \
            --distribution           noble \
            --architectures          amd64 \
            --mirror-bootstrap       http://archive.ubuntu.com/ubuntu \
            --mirror-chroot          http://archive.ubuntu.com/ubuntu \
            --mirror-binary          http://archive.ubuntu.com/ubuntu \
            --mirror-chroot-security http://security.ubuntu.com/ubuntu \
            --binary-images          iso-hybrid \
            --bootloader             grub-pc \
            --debian-installer       none \
            --archive-areas          "main restricted universe" \
            --apt-recommends         false \
            --memtest                none \
            --iso-volume             "ubfi-live" \
            --iso-application        "ubfi Ubuntu Fast Install"

      - name: Paketliste erstellen
        run: |
          mkdir -p lb/config/package-lists
          printf 'systemd-sysv\nudev\nkmod\ndbus\ndialog\nbash\nnano\nless\niproute2\nnetwork-manager\niputils-ping\ncurl\nwget\nca-certificates\nparted\nfdisk\nutil-linux\ndosfstools\ne2fsprogs\nxfsprogs\nbtrfs-progs\ndebootstrap\narch-install-scripts\ngrep\nsed\ngawk\nfindutils\nprocps\npsmisc\npciutils\nusbutils\n' \
            > lb/config/package-lists/ubfi.list.chroot

      - name: ubfi.sh einbetten
        run: |
          mkdir -p lb/config/includes.chroot/usr/local/bin
          cp ubfi.sh lb/config/includes.chroot/usr/local/bin/ubfi.sh
          chmod 755 lb/config/includes.chroot/usr/local/bin/ubfi.sh

      - name: systemd Autostart konfigurieren
        run: |
          mkdir -p lb/config/includes.chroot/etc/systemd/system
          printf '[Unit]\nDescription=ubfi Ubuntu Fast Install\nAfter=multi-user.target network.target\n\n[Service]\nType=oneshot\nExecStart=/usr/bin/bash /usr/local/bin/ubfi.sh\nStandardInput=tty\nStandardOutput=tty\nStandardError=tty\nTTYPath=/dev/tty1\nTTYReset=yes\nTTYVHangup=yes\nRemainAfterExit=yes\n\n[Install]\nWantedBy=multi-user.target\n' \
            > lb/config/includes.chroot/etc/systemd/system/ubfi.service
          mkdir -p "lb/config/includes.chroot/etc/systemd/system/getty@tty1.service.d"
          printf '[Service]\nExecStart=\nExecStart=-/sbin/agetty --autologin root --noclear %%I $TERM\n' \
            > "lb/config/includes.chroot/etc/systemd/system/getty@tty1.service.d/autologin.conf"

      - name: Hooks erstellen
        run: |
          mkdir -p lb/config/hooks/normal
          printf '#!/bin/bash\nset -e\n# dpkg-trigger ausfuehren damit initramfs wirklich gebaut wird\ndpkg --configure -a 2>/dev/null || true\nupdate-initramfs -c -k all 2>/dev/null || update-initramfs -u -k all 2>/dev/null || true\n# Dangling symlinks fixen bevor lb_chroot_hacks laeuft\nfor f in /boot/initrd.img /boot/initrd.img.old; do\n  if [ -L "$f" ] && [ ! -e "$f" ]; then\n    target=$(readlink "$f")\n    rm -f "$f"\n    ln -sf "$target" "$f" 2>/dev/null || true\n  fi\ndone\n' \
            > lb/config/hooks/normal/0005-initramfs.hook.chroot
          chmod +x lb/config/hooks/normal/0005-initramfs.hook.chroot
          printf '#!/bin/bash\nset -e\nsystemctl enable ubfi.service\nfor svc in bluetooth cups avahi-daemon ModemManager; do\n    systemctl disable "$svc" 2>/dev/null || true\ndone\npasswd -d root\napt-get clean\nrm -rf /var/lib/apt/lists/*\n' \
            > lb/config/hooks/normal/0010-ubfi-setup.hook.chroot
          chmod +x lb/config/hooks/normal/0010-ubfi-setup.hook.chroot

      - name: GRUB Bootmenu
        run: |
          mkdir -p lb/config/includes.binary/boot/grub
          printf 'set default=0\nset timeout=3\n\nmenuentry "ubfi - Ubuntu Fast Install" {\n    set gfxpayload=keep\n    linux  /live/vmlinuz boot=live quiet console=tty1\n    initrd /live/initrd\n}\n\nmenuentry "ubfi - Debug verbose" {\n    linux  /live/vmlinuz boot=live console=tty1\n    initrd /live/initrd\n}\n' \
            > lb/config/includes.binary/boot/grub/grub.cfg

      - name: ISO bauen
        run: |
          # lb_chroot_hacks bricht wegen dangling initrd symlinks ab.
          # Fix: initrd symlinks im chroot vor dem Build entfernen (werden von casper neu erstellt)
          sudo grep -n "initrd" /usr/lib/live/build/chroot_hacks || true
          sudo sed -i '/initrd\.img/s/^/# PATCHED: /' /usr/lib/live/build/chroot_hacks || true
          cd lb
          sudo lb build 2>&1 | tee ../build.log
          ls -lh *.iso

      - name: ISO als Artifact hochladen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ubfi-live-iso
          path: lb/*.iso
          retention-days: 7

      - name: Build-Log hochladen bei Fehler
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
