name: Build ubfi Live ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tools installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools

      - name: Basis-System erstellen
        run: |
          sudo debootstrap --arch=amd64 --components=main,restricted,universe noble rootfs http://archive.ubuntu.com/ubuntu

      - name: Pakete installieren
        run: |
          sudo chroot rootfs /bin/bash -c "
            echo 'deb http://archive.ubuntu.com/ubuntu noble main restricted universe' > /etc/apt/sources.list
            echo 'deb http://archive.ubuntu.com/ubuntu noble-updates main restricted universe' >> /etc/apt/sources.list
            echo 'deb http://security.ubuntu.com/ubuntu noble-security main restricted universe' >> /etc/apt/sources.list
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              linux-generic casper initramfs-tools \
              dialog debootstrap parted fdisk dosfstools \
              e2fsprogs xfsprogs btrfs-progs arch-install-scripts \
              network-manager curl wget ca-certificates \
              nano less gawk psmisc pciutils usbutils \
              systemd-sysv udev dbus
          "

      - name: ubfi.sh einbetten
        run: |
          sudo cp ubfi.sh rootfs/usr/local/bin/ubfi.sh
          sudo chmod 755 rootfs/usr/local/bin/ubfi.sh

      - name: systemd konfigurieren
        run: |
          sudo mkdir -p rootfs/etc/systemd/system/getty@tty1.service.d

          sudo tee rootfs/etc/systemd/system/ubfi.service > /dev/null << 'SVCEOF'
          [Unit]
          Description=ubfi Ubuntu Fast Install
          After=multi-user.target

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/bash /usr/local/bin/ubfi.sh
          StandardInput=tty
          StandardOutput=tty
          StandardError=tty
          TTYPath=/dev/tty1
          TTYReset=yes
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
          SVCEOF

          sudo tee rootfs/etc/systemd/system/getty@tty1.service.d/autologin.conf > /dev/null << 'AEOF'
          [Service]
          ExecStart=
          ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
          AEOF

          sudo chroot rootfs systemctl enable ubfi.service

      - name: squashfs erstellen
        run: |
          mkdir -p iso/live iso/boot/grub
          sudo mksquashfs rootfs iso/live/filesystem.squashfs -comp xz -noappend

      - name: Kernel und initrd kopieren
        run: |
          VMLINUZ=$(ls rootfs/boot/vmlinuz-* | head -1)
          INITRD=$(ls rootfs/boot/initrd.img-* | head -1)
          sudo cp "$VMLINUZ" iso/live/vmlinuz
          sudo cp "$INITRD" iso/live/initrd

      - name: GRUB konfigurieren
        run: |
          cat > iso/boot/grub/grub.cfg << 'GEOF'
          set default=0
          set timeout=3

          menuentry "ubfi - Ubuntu Fast Install" {
              linux /live/vmlinuz boot=live quiet splash
              initrd /live/initrd
          }
          GEOF

      - name: ISO erstellen
        run: |
          sudo grub-mkrescue -o ubfi-live.iso iso
          ls -lh ubfi-live.iso

      - name: ISO hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ubfi-live-iso
          path: ubfi-live.iso
          retention-days: 7

      - name: Build-Log bei Fehler
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: "*.log"
          retention-days: 3
